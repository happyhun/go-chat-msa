apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-chat-test

resources:
  - ../../../base/foundation

patches:
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: gochat-secret
      stringData:
        APP_JWT_SECRET: e2e_secret
        APP_INTERNAL_SECRET: e2e_internal_secret
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Deployment
      name: mongo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 256Mi
          limits:
            memory: 768Mi
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
