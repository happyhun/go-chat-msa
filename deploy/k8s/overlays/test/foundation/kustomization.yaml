apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-chat-test

resources:
  - ../../../base/foundation

patches:
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: gochat-secret
      stringData:
        APP_JWT_SECRET: e2e_secret
        APP_INTERNAL_SECRET: e2e_internal_secret

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
