apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: mongo
    spec:
      containers:
        - name: mongo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /data/configdb
        - name: mongo-proxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          imagePullPolicy: Always
          args:
            - -host=0.0.0.0
            - -config=/config/proxies.json
          ports:
            - name: mongo-proxy
              containerPort: 27018
            - name: proxy-admin
              containerPort: 8474
          volumeMounts:
            - name: mongo-proxy-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /version
              port: proxy-admin
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /version
              port: proxy-admin
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mongo-proxy-config
          configMap:
            name: mongo-proxy-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
