apiVersion: v1
kind: Namespace
metadata:
  name: gochat-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: gochat-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gochat-gateway
rules:
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - services
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - referencegrants
      - backendtlspolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
      - grpcroutes/status
      - tlsroutes/status
      - referencegrants/status
      - backendtlspolicies/status
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gochat-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gochat-gateway
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: gochat-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: gochat-traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: gochat-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      nodeSelector:
        ingress-ready: 'true'
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7
          imagePullPolicy: Always
          args:
            - --providers.kubernetesgateway=true
            - --providers.kubernetesgateway.namespaces=go-chat-dev,go-chat-test,go-chat-qa
            - --entrypoints.web.address=:8000
            - --entrypoints.web.transport.respondingtimeouts.readtimeout=0s
            - --entrypoints.web.transport.respondingtimeouts.idletimeout=86400s
            - --ping=true
            - --ping.entrypoint=health
            - --entrypoints.health.address=:9000
            - --api.dashboard=false
          ports:
            - name: web
              containerPort: 8000
              hostPort: 80
            - name: health
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /ping
              port: health
          livenessProbe:
            httpGet:
              path: /ping
              port: health
