      labels:
        app.kubernetes.io/name: mongo-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-migrate
          image: migrate/migrate:v4.19.1
          imagePullPolicy: IfNotPresent
          args:
            - -path
            - /migrations
            - -database
            - $(APP_DB_MONGO_URI)/chat_service
            - up
          envFrom:
            - secretRef:
                name: gochat-secret
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          resources:
