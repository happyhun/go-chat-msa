apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: swagger-ui
      app.kubernetes.io/component: docs
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: {{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swagger-ui
        app.kubernetes.io/component: docs
        app.kubernetes.io/part-of: go-chat-msa
        app.kubernetes.io/instance: {{ .Release.Namespace }}
      annotations:
        checksum/config: {{ include "gochat.swagger-ui.config" . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: swagger-ui
        image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SWAGGER_JSON
          value: /openapi/openapi.yaml
        - name: BASE_URL
          value: /docs
        - name: PORT
          value: '8080'
        volumeMounts:
        - name: openapi
          mountPath: /openapi/openapi.yaml
          subPath: openapi.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: swagger-conf
          mountPath: /etc/nginx/conf.d
        - name: swagger-cache
          mountPath: /var/cache/nginx
        - name: swagger-run
          mountPath: /var/run
        - name: swagger-html
          mountPath: /usr/share/nginx/html
        readinessProbe:
          httpGet:
            path: /docs/
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /docs/
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: openapi
        configMap:
          name: openapi-spec
      - name: swagger-conf
        emptyDir: {}
      - name: swagger-cache
        emptyDir: {}
      - name: swagger-run
        emptyDir: {}
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: swagger-html
        emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: swagger-assets
        image: swaggerapi/swagger-ui:v5.33.0
        imagePullPolicy: Always
        command:
        - sh
        - -ec
        - cp -R /usr/share/nginx/html/. /assets/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: swagger-html
          mountPath: /assets
