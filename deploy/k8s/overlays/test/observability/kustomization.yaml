apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-chat-test

resources:
  - ../../../base/observability

patches:
  - target:
      kind: ClusterRole
      name: gochat-alloy-cadvisor
    patch: |-
      - op: replace
        path: /metadata/name
        value: gochat-alloy-cadvisor-test
  - target:
      kind: ClusterRoleBinding
      name: gochat-alloy-cadvisor
    patch: |-
      - op: replace
        path: /metadata/name
        value: gochat-alloy-cadvisor-test
      - op: replace
        path: /roleRef/name
        value: gochat-alloy-cadvisor-test
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
      spec:
        template:
          spec:
            containers:
              - name: grafana
                env:
                  - name: GF_SERVER_ROOT_URL
                    value: "http://test.gochat.localhost:30080/grafana/"
  - target:
      kind: Deployment
      name: alloy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Deployment
      name: kube-state-metrics
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 256Mi
          limits:
            memory: 768Mi
  - target:
      kind: Deployment
      name: loki
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Deployment
      name: tempo
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Deployment
      name: pyroscope
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: test.gochat.localhost

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
