apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: service
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
  selector:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: user-service
          image: go-chat-msa/user-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: gochat-config
            - secretRef:
                name: gochat-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config-files
              mountPath: /app/configs/k8s-dev.yaml
              subPath: k8s-dev.yaml
              readOnly: true
            - name: config-files
              mountPath: /app/configs/k8s-test.yaml
              subPath: k8s-test.yaml
              readOnly: true
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50051
              service: user.v1.UserService
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config-files
          configMap:
            name: gochat-config-files
