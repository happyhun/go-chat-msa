apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: prometheus-config
    files:
      - config.yaml=prometheus/config.yaml
  - name: loki-config
    files:
      - config.yaml=loki/config.yaml
  - name: tempo-config
    files:
      - config.yaml=tempo/config.yaml
  - name: pyroscope-config
    files:
      - config.yaml=pyroscope/config.yaml
  - name: prometheus-rules
    files:
      - prometheus/rules/gochat-alerts.yaml
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/loki.yaml
      - grafana/provisioning/datasources/prometheus.yaml
      - grafana/provisioning/datasources/pyroscope.yaml
      - grafana/provisioning/datasources/tempo.yaml
  - name: grafana-dashboards
    files:
      - grafana/provisioning/dashboards/dashboards.yaml
      - grafana/provisioning/dashboards/gochat-database.json
      - grafana/provisioning/dashboards/gochat-infra.json
      - grafana/provisioning/dashboards/gochat-message.json
      - grafana/provisioning/dashboards/gochat-overview.json
      - grafana/provisioning/dashboards/gochat-traffic.json
