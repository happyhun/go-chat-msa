apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
      app.kubernetes.io/component: data
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: {{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: go-chat-msa
        app.kubernetes.io/instance: {{ .Release.Namespace }}
      annotations:
        kubectl.kubernetes.io/default-container: mongo
        checksum/config: {{ include "gochat.mongo.config" . | sha256sum }}
    spec:
      containers:
{{ if .Values.proxy.enabled }}
      - name: mongo-proxy
        image: ghcr.io/shopify/toxiproxy:2.12.0
        imagePullPolicy: Always
        args:
        - -host=0.0.0.0
        - -config=/config/proxies.json
        ports:
        - name: mongo-proxy
          containerPort: 27018
        - name: proxy-admin
          containerPort: 8474
        volumeMounts:
        - name: mongo-proxy-config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /version
            port: proxy-admin
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /version
            port: proxy-admin
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
{{ end }}
      - name: mongo
        image: {{ .Values.image | quote }}
        imagePullPolicy: Always
        ports:
        - name: mongo
          containerPort: 27017
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /data/configdb
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping').ok
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping').ok
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
{{ if .Values.proxy.enabled }}
      - name: mongo-proxy-config
        configMap:
          name: mongo-proxy-config
{{ end }}
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
