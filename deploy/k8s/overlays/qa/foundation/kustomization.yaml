apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-chat-qa
resources:
  - ../../../base/foundation
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-qa
patches:
  - target:
      kind: Gateway
      name: gochat
    patch: |
      - op: replace
        path: /spec/listeners/0/hostname
        value: qa.gochat.localhost
