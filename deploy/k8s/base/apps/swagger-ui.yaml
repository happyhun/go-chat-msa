apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swagger-ui
      app.kubernetes.io/component: docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swagger-ui
        app.kubernetes.io/component: docs
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SWAGGER_JSON
              value: /openapi/openapi.yaml
            - name: BASE_URL
              value: /docs
          volumeMounts:
            - name: openapi
              mountPath: /openapi/openapi.yaml
              subPath: openapi.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /docs/
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /docs/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: openapi
          configMap:
            name: openapi-spec
