apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  labels:
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  labels:
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket-service
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket-service
        app.kubernetes.io/component: service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: websocket-service
          image: go-chat-msa/websocket-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - secretRef:
                name: gochat-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_WEBSOCKET_ADVERTISED_ADDR
              value: $(POD_IP):8081
          volumeMounts:
            - name: app-config
              mountPath: /app/configs
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: app-config
          configMap:
            name: gochat-app-config
