apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-chat-test
resources:
  - ../../../base/foundation
patches:
  - path: mongo-proxy.yaml
  - target:
      kind: Service
      name: mongo
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: mongo-proxy
  - target:
      kind: Gateway
      name: gochat
    patch: |
      - op: replace
        path: /spec/listeners/0/hostname
        value: test.gochat.localhost
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
configMapGenerator:
  - name: mongo-proxy-config
    files:
      - config/proxies.json
