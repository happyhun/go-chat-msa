apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-chat-dev

resources:
  - ../../../base

patches:
  - path: patches/grafana-root-url.yaml
  - path: patches/ingress-host.yaml
    target:
      kind: Ingress
      name: grafana

patchesStrategicMerge:
  - delete-non-observability.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-dev
