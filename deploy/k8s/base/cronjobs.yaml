apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-job
  labels:
    app.kubernetes.io/name: retention-job
    app.kubernetes.io/component: batch
spec:
  schedule: "0 3 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention-job
            app.kubernetes.io/component: batch
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention-job
              image: go-chat-msa/retention-job:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: gochat-config
                - secretRef:
                    name: gochat-secret
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              volumeMounts:
                - name: config-files
                  mountPath: /app/configs/k8s-dev.yaml
                  subPath: k8s-dev.yaml
                  readOnly: true
                - name: config-files
                  mountPath: /app/configs/k8s-test.yaml
                  subPath: k8s-test.yaml
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: config-files
              configMap:
                name: gochat-config-files
