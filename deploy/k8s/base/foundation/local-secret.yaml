apiVersion: v1
kind: Secret
metadata:
  name: gochat-secret
  labels:
    app.kubernetes.io/name: gochat-secret
    app.kubernetes.io/component: config
type: Opaque
# Local dev/test placeholder values. Use an external secret manager for shared or production clusters.
stringData:
  APP_JWT_SECRET: dev_secret_key_1234
  APP_INTERNAL_SECRET: dev_internal_secret_1234
  APP_DB_POSTGRES_URL: postgres://postgres@postgres:5432/go_chat?sslmode=disable
  APP_DB_MONGO_URI: mongodb://mongo:27017
