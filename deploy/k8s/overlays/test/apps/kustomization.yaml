apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: go-chat-test
resources:
  - ../../../base/apps
configMapGenerator:
  - name: gochat-app-config
    behavior: merge
    files:
      - override.yaml=config/app/override.yaml
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (gateway,service)
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
        - test.gochat.localhost
labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
