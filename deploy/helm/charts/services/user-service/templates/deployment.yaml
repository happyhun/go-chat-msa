apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
      app.kubernetes.io/component: service
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: {{ .Release.Namespace }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: go-chat-msa
        app.kubernetes.io/instance: {{ .Release.Namespace }}
      annotations:
        checksum/config: {{ .Values.global.appConfig | toJson | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: user-service
        image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
        imagePullPolicy: Never
        ports:
        - name: grpc
          containerPort: 50051
        envFrom:
        - secretRef:
            name: gochat-secret
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: app-config
          mountPath: /app/configs
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 2
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50051
            service: user.v1.UserService
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: '0'
          limits:
            cpu: '4'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: app-config
        configMap:
          name: gochat-app-config
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        sysctls: {{ .Values.global.sysctls | toJson }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: {{ .Release.Namespace }}
            app.kubernetes.io/part-of: go-chat-msa
            app.kubernetes.io/name: user-service
