apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: websocket-service
  labels:
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gochat
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /ws
    backendRefs:
    - name: websocket-service
      port: 8081
  hostnames:
  - {{ .Values.global.host | quote }}
