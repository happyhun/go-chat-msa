apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: data
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    max_payload: 1MB
    write_deadline: "3s"
    jetstream {
      store_dir: /data/jetstream
      max_file_store: 1536MB
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: data
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
    - name: metrics
      port: 7777
      targetPort: metrics
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: data
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: data
    spec:
      containers:
        - name: nats
          image: nats:2.14.6-alpine
          imagePullPolicy: IfNotPresent
          args:
            - nats-server
            - --config
            - /etc/nats/nats.conf
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        - name: nats-exporter
          image: natsio/prometheus-nats-exporter:0.20.1
          imagePullPolicy: IfNotPresent
          args:
            - -varz
            - -jsz=all
            - -connz_detailed
            - -prefix=nats
            - -use_internal_server_id
            - http://localhost:8222
          ports:
            - name: metrics
              containerPort: 7777
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
