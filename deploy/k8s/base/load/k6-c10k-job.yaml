apiVersion: batch/v1
kind: Job
metadata:
  name: k6-c10k
  labels:
    app.kubernetes.io/name: k6-c10k
    app.kubernetes.io/component: load-test
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimitPerIndex: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-c10k
        app.kubernetes.io/component: load-test
    spec:
      restartPolicy: Never
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: k6-c10k
              app.kubernetes.io/component: load-test
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: 10240 65535
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          imagePullPolicy: Always
          command:
            - sh
            - -lc
          args:
            - |
              worker_index="${JOB_COMPLETION_INDEX:-0}"
              worker_vus="${K6_WORKER_VUS:-2500}"
              export K6_TARGET_VUS="${worker_vus}"
              export K6_VU_OFFSET="$((worker_index * worker_vus))"
              printf 'k6 ip_local_port_range='
              cat /proc/sys/net/ipv4/ip_local_port_range
              printf 'k6 nofile='
              ulimit -n
              printf 'k6 worker_index=%s vus=%s offset=%s\n' "${worker_index}" "${K6_TARGET_VUS}" "${K6_VU_OFFSET}"
              exec k6 run --log-format raw /scripts/c10k-test.js
          envFrom:
            - configMapRef:
                name: k6-load-env
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          volumeMounts:
            - name: k6-load-scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: k6-load-scripts
          configMap:
            name: k6-load-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      automountServiceAccountToken: false
  activeDeadlineSeconds: 2400
