apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrate
  labels:
    app.kubernetes.io/name: postgres-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: go-chat-msa
        app.kubernetes.io/instance: {{ .Release.Namespace }}
    spec:
      restartPolicy: Never
      containers:
      - name: postgres-migrate
        image: migrate/migrate:v4.20.1
        imagePullPolicy: Always
        args:
        - -path
        - /migrations
        - -database
        - $(APP_DB_POSTGRES_URL)
        - up
        envFrom:
        - secretRef:
            name: gochat-secret
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: migrations
        configMap:
          name: postgres-migrations
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
