openapi: 3.0.3
info:
  title: Go Chat MSA API
  version: "1.0.0"
  license:
    name: 무단 사용 금지
    url: https://choosealicense.com/no-permission/
  description: |
    Go Chat MSA 프로젝트의 REST API 명세서입니다.
    - REST API 에러는 RFC 9457 (Problem Details) 형식을 따릅니다. WebSocket 업그레이드 검증 오류는 일반 HTTP 오류 본문일 수 있습니다.
    - 보안을 위해 JWT(Access Token)와 HttpOnly Cookie(Refresh Token)를 혼합하여 사용합니다.
    - 웹소켓 연결은 1회용 단기 티켓 기반으로 수행됩니다.

servers:
  - url: /api
    description: Kubernetes Ingress를 통한 API Gateway 경로

tags:
  - name: System
    description: 시스템 상태 점검 및 메트릭 수집
  - name: Auth
    description: 사용자 가입, 로그인, 로그아웃 및 토큰 관리
  - name: User
    description: 사용자 정보 조회 (작성자 표시용 일괄 조회)
  - name: Room
    description: 채팅방 생성, 수정, 삭제 및 참여 관리
  - name: Message
    description: 채팅방 메시지 내역 조회 및 동기화
  - name: WebSocket
    description: 실시간 채팅을 위한 웹소켓 연결 관리

paths:
  /health:
    get:
      tags:
        - System
      summary: 시스템 상태 점검 (Liveness Probe)
      description: API Gateway 프로세스의 생존 여부를 확인합니다. 의존성 준비 상태는 /ready에서 확인합니다.
      operationId: checkHealth
      security: []
      responses:
        '200':
          description: 정상 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /ready:
    get:
      tags:
        - System
      summary: 트래픽 수신 준비 상태 점검 (Readiness Probe)
      description: API Gateway의 Redis 연결, user-service health, chat-service의 ChatCommand health를 확인합니다. MongoDB 조회 가능 여부와 stream 여유 용량은 보장하지 않습니다.
      operationId: checkReadiness
      security: []
      responses:
        '200':
          description: 준비 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ready"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /users:
    post:
      tags:
        - Auth
      summary: 신규 회원 가입
      description: 새로운 사용자를 생성합니다. (IP 당 5 RPS 제한)
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 회원 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    get:
      tags:
        - User
      summary: 사용자 일괄 조회
      description: 채팅 메시지 작성자 표시 등을 위해 user_id 목록으로 사용자 정보를 조회합니다. 삭제된 사용자는 응답에서 제외됩니다. 한 요청당 최대 100개.
      operationId: batchGetUsers
      security:
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          description: 조회할 user_id 목록 (최대 100개)
          schema:
            type: array
            items:
              type: string
              format: uuid
            minItems: 1
            maxItems: 100
          style: form
          explode: true
      responses:
        '200':
          description: 조회 성공 (요청 ID 중 활성 사용자만 반환)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/token:
    post:
      tags:
        - Auth
      summary: 로그인 및 토큰 발급
      description: 로그인 성공 시 Access Token을 응답 본문으로, Refresh Token을 보안 쿠키로 반환합니다. (IP 당 5 RPS 제한)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyUserRequest'
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 (HttpOnly, Secure, Path=/auth)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      tags:
        - Auth
      summary: 로그아웃
      description: 현재 세션을 종료하고 Redis에 저장된 Refresh Token을 폐기합니다. 보안 쿠키에 담긴 Refresh Token으로 인증합니다.
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        '204':
          description: 로그아웃 성공 (응답 본문 없음)
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 만료 헤더
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/token/refresh:
    post:
      tags:
        - Auth
      summary: Access Token 재발급
      description: 보안 쿠키에 담긴 Refresh Token을 확인하여 새로운 Access Token을 발급합니다.
      operationId: refreshToken
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 재발급 성공
          headers:
            Set-Cookie:
              description: 새로 갱신된 Refresh Token 쿠키 (RTR 적용)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    delete:
      tags:
        - Auth
      summary: 회원탈퇴
      description: 본인 인증을 위해 비밀번호를 함께 받아 검증한 뒤 사용자 계정을 즉시 삭제하고 모든 Refresh Token을 폐기합니다. 삭제 후 동일 username은 즉시 다시 사용할 수 있습니다.
      operationId: deleteUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '204':
          description: 탈퇴 성공 (응답 본문 없음)
          headers:
            Set-Cookie:
              description: Refresh Token 쿠키 만료 헤더
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/rooms:
    get:
      tags:
        - Room
      summary: 참여 중인 채팅방 목록 조회
      description: 현재 인증된 사용자가 참여 중인 채팅방 목록을 반환합니다.
      operationId: listJoinedRooms
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms:
    get:
      tags:
        - Room
      summary: 채팅방 검색
      description: 전체 채팅방을 대상으로 이름 기반 검색을 수행합니다.
      operationId: searchRooms
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: "검색어 (생략 시 전체 채팅방 목록 반환)"
          schema:
            type: string
        - name: limit
          in: query
          description: 페이지당 개수 (기본 20, 최대 100)
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: 검색 시작 위치
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags:
        - Room
      summary: 채팅방 생성
      description: 새로운 채팅방을 만듭니다. 방을 만든 사람은 자동으로 방장이 되며 해당 방에 참여합니다.
      operationId: createRoom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{id}:
    patch:
      tags:
        - Room
      summary: 채팅방 정보 수정
      description: 방장만 호출 가능하며, 채팅방의 이름과 최대 정원을 변경합니다.
      operationId: updateRoom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '204':
          description: 수정 성공
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      tags:
        - Room
      summary: 채팅방 삭제
      description: 방장만 호출 가능하며, 채팅방을 삭제하고 해당 방의 모든 웹소켓 연결을 강제 종료합니다.
      operationId: deleteRoom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{id}/members:
    get:
      tags:
        - Room
      summary: 채팅방 멤버 목록 조회
      description: 채팅방에 참여 중인 멤버 목록을 반환합니다. 요청자가 해당 방의 멤버여야 합니다.
      operationId: listRoomMembers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 멤버 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomMemberInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{id}/members/me:
    put:
      tags:
        - Room
      summary: 채팅방 참여
      description: 대상 채팅방에 참여합니다. 인원이 꽉 찼다면 실패합니다. (이미 참여 중인 경우에도 성공 반환)
      operationId: joinRoom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 참여 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 정원 초과로 참여 불가
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      tags:
        - Room
      summary: 채팅방 나가기
      description: 채팅방에서 퇴장합니다.
      operationId: leaveRoom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 퇴장 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /rooms/{id}/messages:
    get:
      tags:
        - Message
      summary: 메시지 내역 조회 및 동기화
      description: |
        채팅방의 메시지를 가져옵니다. 본인이 방에 참여한 시점 이후의 메시지만 조회됩니다.
        - 과거 내역 조회: `after_id` 없이 호출하면 가장 최근 메시지부터 id 역순으로 반환합니다.
        - 누락분 동기화: `after_id`를 포함하면 해당 id 이후를 id 정순으로 반환합니다.
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 채팅방 UUID
          schema:
            type: string
            format: uuid
        - name: after_id
          in: query
          description: 이 id보다 큰 메시지를 id 정순으로 반환. 빈 값은 참여 시점 이후 전체 동기화. 저장 지연 때문에 빈 응답은 누락 없음의 증거가 아님
          allowEmptyValue: true
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: string
                enum: ['']
        - name: limit
          in: query
          description: 가져올 메시지 수. 생략 시 과거 조회 100개, 동기화 50개. 1000을 넘으면 1000개로 제한합니다.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: 메시지 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageInfo'
                  has_more:
                    type: boolean
                    description: 이 응답 뒤에 더 받을 메시지가 있는지 여부
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: 메시지 조회를 처리할 수 없음. MongoDB 장애 중에도 WebSocket 송신은 가능할 수 있습니다.
          headers:
            Retry-After:
              description: 재시도 전 대기 시간 (초)
              schema:
                type: integer
                example: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/ws-ticket:
    post:
      tags:
        - WebSocket
      summary: 웹소켓 연결용 일회용 티켓 발급
      description: |
        웹소켓 연결 전 인증을 위해 호출합니다.
        발급받은 티켓의 유효기간은 30초이며 한 번만 사용할 수 있습니다.
      operationId: createWSTicket
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 티켓 발급 성공
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /ws:
    get:
      tags:
        - WebSocket
      summary: 웹소켓 핸드셰이크 (연결 요청)
      description: |
        발급받은 티켓을 소비하고 방 멤버십과 NATS 방 구독을 확인한 뒤 채팅 송수신 연결을 맺습니다.
        연결에 실패했거나 재연결할 때는 새 티켓을 발급받아야 합니다.
        `ws://` 또는 `wss://` 프로토콜을 사용해야 합니다.

        클라이언트는 JSON frame으로 `content`와 소문자 canonical UUID인 `client_msg_id`를 보냅니다.
        `type`은 생략하거나 `chat`으로 지정합니다. 본문은 비어 있을 수 없고 기본 최대 길이는 10,000자입니다.
        같은 방·발신자의 동일 요청 재시도에는 원래 `client_msg_id`와 본문을 유지합니다.
        JSON 해석 후 형식·본문 길이·메시지 처리율 제한 위반은 해당 세션에 system frame으로 알립니다.
        JSON 메시지 전체 크기가 64KiB를 넘으면 연결을 종료합니다.

        채팅은 JetStream에 기록한 뒤 Core NATS로 같은 방의 세션에 전달하며 발신자도 echo를 받습니다.
        서버 frame은 메시지 ID, 방·발신자 ID, 본문, 종류, 시각을 포함합니다.
        채팅 echo에는 `client_msg_id`도 포함됩니다. 로컬 오류 알림에는 메시지 ID가 없을 수 있습니다.
        메시지는 여러 Pod 사이에서 순서가 바뀌거나 중복될 수 있습니다.
        클라이언트는 ID와 방·발신자·`client_msg_id`로 중복을 제거하고 ID로 정렬합니다.

        echo는 MongoDB 저장 완료를 뜻하지 않으며 별도의 수락 ACK frame은 없습니다.
        발행 오류는 세션을 종료합니다. 발행 timeout에서는 저장·echo 여부가 모호할 수 있습니다.
        세션 전송 큐가 가득 차면 해당 연결을 종료합니다.
        클라이언트는 재연결 후 REST 메시지 조회로 저장된 이력을 보충하며 주기적 동기화도 유지합니다.
      operationId: connectWS
      security:
        - wsTicket: []
      servers:
        - url: /
          description: Kubernetes Ingress를 통한 WebSocket 업그레이드 경로
      parameters:
        - name: room_id
          in: query
          required: true
          description: 접속할 채팅방 UUID
          schema:
            type: string
            format: uuid
        - name: ticket
          in: query
          required: true
          description: 발급받은 일회용 인증 티켓
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: 연결 성공 (프로토콜 전환)
        '400':
          description: room_id 누락·UUID 형식 오류 또는 잘못된 WebSocket 업그레이드 요청
        '401':
          description: 인증 실패 (잘못되었거나 만료된 티켓)
        '403':
          description: 방 멤버가 아니거나 허용되지 않은 Origin
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: NATS 연결·방 구독·세션 등록 준비 불가. 업그레이드 후 등록에 실패하면 HTTP 오류 대신 연결을 닫습니다.
          headers:
            Retry-After:
              description: 재시도 전 대기 시간 (초)
              schema:
                type: integer
                example: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '500':
          description: 방 멤버십 확인 중 내부 오류 또는 예상하지 못한 세션 등록 준비 오류
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "API 요청 시 Header에 'Authorization: Bearer <Access Token>' 형식으로 포함합니다."
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: "HttpOnly, SameSite=Strict refresh token cookie입니다. 운영 환경에서는 Secure 속성이 추가됩니다."
    wsTicket:
      type: apiKey
      in: query
      name: ticket
      description: "웹소켓 핸드셰이크에 사용하는 30초 TTL 일회용 티켓입니다."

  schemas:

    # Auth
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 12
          pattern: '^[a-zA-Z0-9가-힣]+$'
          description: "영문, 숫자, 한글 허용 (2~12자)"
        password:
          type: string
          minLength: 10
          maxLength: 64
          pattern: '^(?:(?=.*[a-z])(?=.*[A-Z])(?=.*\d)|(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z\d])|(?=.*[a-z])(?=.*\d)(?=.*[^a-zA-Z\d])|(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z\d])).{10,64}$'
          description: "대/소문자, 숫자, 특수문자 중 3가지 이상 조합 (10자 이상)"

    CreateUserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid

    VerifyUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    VerifyUserResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        access_token:
          type: string
          description: "수명이 짧은 JWT 인증 토큰"

    RefreshTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "새로 발급된 JWT 인증 토큰"

    DeleteUserRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: "본인 인증용 현재 비밀번호"

    User:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string

    BatchGetUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    # Room
    CreateRoomRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 1000

    CreateRoomResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid

    UpdateRoomRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
          maximum: 1000

    RoomListResponse:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/RoomInfo'
        total_count:
          type: integer
          description: "총 검색 결과 수 (검색어를 사용했을 때만 포함됨)"

    RoomInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        manager_id:
          type: string
          format: uuid
        capacity:
          type: integer
        member_count:
          type: integer
          description: "채팅방에 참여 중인 멤버 수"
        joined_at:
          type: string
          format: date-time
          description: "방에 참여한 시간 (참여 중인 방 조회 시에만 포함)"

    RoomMemberInfo:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        joined_at:
          type: string
          format: date-time

    # Message
    MessageInfo:
      type: object
      required: [id, room_id, sender_id, content, type, timestamp]
      properties:
        id:
          type: string
          format: uuid
          description: 메시지 고유 식별자 (UUID v7). 사전순으로 정렬하며 Pod 간 인과 순서나 도착 순서를 보장하지 않음
        room_id:
          type: string
          format: uuid
        sender_id:
          type: string
          description: 작성자 user id. 시스템 메시지는 `system`
        content:
          type: string
        client_msg_id:
          type: string
          description: 클라이언트가 생성한 멱등성 키
        type:
          type: string
          description: "메시지 종류 ('chat' 또는 'system')"
        timestamp:
          type: integer
          format: int64
          description: 작성 시각 (Unix 초)

    # Common
    ProblemDetails:
      type: object
      description: 에러 발생 시 반환되는 표준 형식 (RFC 9457)
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "필수 값이 누락되었습니다."

  responses:
    BadRequest:
      description: "요청 값이 잘못됨 (예: 규칙 위반, 누락 등)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: "인증 실패 (토큰 없음, 만료, 변조)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: "접근 권한 없음 (예: 방장이 아님)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: "요청한 대상을 찾을 수 없음"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: "상태 충돌 (예: 아이디 중복, 방 정원 초과)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: "요청 빈도 초과 (Rate Limit)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: "서비스가 아직 트래픽을 받을 준비가 되지 않음"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
