apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - user-service.yaml
  - chat-service.yaml
  - api-gateway.yaml
  - websocket-service.yaml
  - frontend.yaml
  - swagger-ui.yaml
  - routes.yaml
