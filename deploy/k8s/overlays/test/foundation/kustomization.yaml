apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-chat-test

resources:
  - ../../../base

patches:
  - path: patches/test-config.yaml

patchesStrategicMerge:
  - delete-non-foundation.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: go-chat-msa
      app.kubernetes.io/instance: go-chat-test
