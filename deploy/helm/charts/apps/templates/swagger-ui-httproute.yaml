apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: swagger-ui
  labels:
    app.kubernetes.io/name: swagger-ui
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: go-chat-msa
    app.kubernetes.io/instance: {{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gochat
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /docs
    backendRefs:
    - name: swagger-ui
      port: 8080
  hostnames:
  - {{ .Values.global.host | quote }}
