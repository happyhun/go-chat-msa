apiVersion: v1
kind: Service
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: service
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
  selector:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  labels:
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-service
        app.kubernetes.io/component: service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: chat-service
          image: go-chat-msa/chat-service:build-required
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 50052
          envFrom:
            - secretRef:
                name: gochat-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: app-config
              mountPath: /app/configs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50052
              service: chat.v1.ChatCommand
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-config
          configMap:
            name: gochat-app-config
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chat-service
