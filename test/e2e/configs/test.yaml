ENV: "test"

REGISTRY:
  USER_SERVICE:
    HOST: "user-service"
  CHAT_SERVICE:
    HOST: "chat-service"
  WS_GATEWAY:
    HOST: "ws-gateway"
  WEBSOCKET_ENDPOINTS: ["websocket-service-1:8081", "websocket-service-2:8081"]

JWT:
  SECRET: "e2e_secret"

INTERNAL:
  SECRET: "e2e_internal_secret"

DB:
  POSTGRES_URL: "postgres://postgres@postgres:5432/go_chat?sslmode=disable"
  MONGO_URI: "mongodb://mongo:27017"

REDIS:
  ADDR: "redis:6379"

API_GATEWAY:
  CORS:
    ALLOWED_ORIGINS: ["*"]
  RATE_LIMIT:
    PUBLIC:
      RPS: 10
      BURST: 15
      TTL: "1h"
    AUTHENTICATED:
      RPS: 10
      BURST: 30
      TTL: "1h"

WS_GATEWAY:
  CORS:
    ALLOWED_ORIGINS: ["*"]
  RATE_LIMIT:
    PUBLIC:
      RPS: 10
      BURST: 20
      TTL: "1h"
    WS_ESTABLISH:
      RPS: 4
      BURST: 10
      TTL: "1h"

WEBSOCKET:
  RATE_LIMIT:
    WS_MESSAGE:
      RPS: 4
      BURST: 10
      TTL: "1h"
